        // ============================================
        // GLOBE RENDERING
        // ============================================
        function getGlobeColor(t) {
            if (t < 0.5) {
                const r = Math.round(0 + (255 - 0) * (t * 2));
                const g = Math.round(255 - (255 - 0) * (t * 2));
                const b = 255;
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const t2 = (t - 0.5) * 2;
                const r = 255;
                const g = Math.round(0 + (255 - 0) * t2);
                const b = Math.round(255 - (255 - 0) * t2);
                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        function updateGlobe() {
            const container = document.getElementById('globeViz');
            
            const entriesWithLoc = quizData
                .filter(entry => entry.loc && entry.loc.includes(','))
                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            const points = entriesWithLoc.map((entry, index) => {
                const [lat, lng] = entry.loc.split(',').map(Number);
                const t = entriesWithLoc.length > 1 ? index / (entriesWithLoc.length - 1) : 1;
                const color = getGlobeColor(t);
                
                const rating = parseFloat(entry.rating) || 0;
                const size = ((rating + 2) / 4) * 0.7 + 0.3;
                
                return {
                    lat: lat,
                    lng: lng,
                    size: size,
                    color: color,
                    label: `${new Date(entry.timestamp).toLocaleDateString()}\nrating: ${rating > 0 ? '+' : ''}${rating}`
                };
            });

            if (globe) {
                globe._destructor && globe._destructor();
                container.innerHTML = '';
                globe = null;
            }

            globe = Globe()
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundColor('#0D0D0D')
                .pointsData(points)
                .pointLat('lat')
                .pointLng('lng')
                .pointColor('color')
                .pointAltitude(0.01)
                .pointRadius('size')
                .pointLabel('label')
                .atmosphereColor('#333333')
                .atmosphereAltitude(0.15)
                (container);

            if (entriesWithLoc.length > 0) {
                const latest = entriesWithLoc[entriesWithLoc.length - 1];
                const [latestLat, latestLng] = latest.loc.split(',').map(Number);
                globe.pointOfView({ lat: latestLat, lng: latestLng, altitude: 1.5 }, 1000);
            } else {
                globe.pointOfView({ lat: 20, lng: 0, altitude: 2.5 }, 1000);
            }
        }

        // ============================================
        // CHART RENDERING (Custom Canvas)
        // ============================================
        function updateChart() {
            if (chartMode === 'loc') return;
            
            const canvas = document.getElementById('myChart');
            const { ctx, width, height } = setupCanvas(canvas);
            
            // Store dimensions for click handling
            chartWidth = width;
            chartHeight = height;
            
            const padding = chartPadding;
            const chartW = width - padding.left - padding.right;
            const chartH = height - padding.top - padding.bottom;

            // Clear canvas
            ctx.fillStyle = '#0D0D0D';
            ctx.fillRect(0, 0, width, height);

            // Filter data by time range
            let filteredData = [...quizData].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            if (timeRange !== 'all' && filteredData.length > 0) {
                const now = new Date();
                let cutoffDate = new Date();
                
                if (timeRange === '1w') {
                    cutoffDate.setDate(now.getDate() - 7);
                } else if (timeRange === '1m') {
                    cutoffDate.setDate(now.getDate() - 30);
                }
                
                filteredData = filteredData.filter(entry => new Date(entry.timestamp) >= cutoffDate);
            }

            if (filteredData.length === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '14px Karla';
                ctx.textAlign = 'center';
                ctx.fillText('No data for this time range', width / 2, height / 2);
                document.getElementById('dateStart').textContent = '';
                document.getElementById('dateEnd').textContent = '';
                return;
            }

            // ============================================
            // TIME-BASED X-AXIS POSITIONING
            // Each entry is snapped to the nearest 3-hour
            // mark (8 sub-days) so real time gaps between
            // entries are visible on the chart.
            // ============================================
            const SNAP_MS = 3 * 60 * 60 * 1000; // 3 hours
            let rangeStart, rangeEnd;
            if (timeRange === '1w') {
                rangeEnd = Date.now();
                rangeStart = rangeEnd - 7 * 24 * 60 * 60 * 1000;
            } else if (timeRange === '1m') {
                rangeEnd = Date.now();
                rangeStart = rangeEnd - 30 * 24 * 60 * 60 * 1000;
            } else {
                rangeStart = new Date(filteredData[0].timestamp).getTime();
                rangeEnd = new Date(filteredData[filteredData.length - 1].timestamp).getTime();
                if (rangeEnd <= rangeStart) rangeEnd = rangeStart + SNAP_MS;
            }
            const rangeSpan = rangeEnd - rangeStart;
            const computeXPos = (timestamp) => {
                const t = new Date(timestamp).getTime();
                const snapped = Math.round(t / SNAP_MS) * SNAP_MS;
                return Math.max(0, Math.min(1, (snapped - rangeStart) / rangeSpan));
            };

            // Build chart data
            let chartData;
            
            if (chartMode === 'percent') {
                chartData = filteredData.map(entry => {
                    const cyanQuestions = questions.filter(q => q.color === 'C' && q.type === 'yesno' && !q.intimacyType);
                    const magentaQuestions = questions.filter(q => q.color === 'M' && q.type === 'yesno' && !q.intimacyType);
                    const yellowQuestions = questions.filter(q => q.color === 'Y' && q.type === 'yesno' && !q.intimacyType);

                    const cyanAnswered = cyanQuestions.filter(q => entry[q.id] === 'yes' || entry[q.id] === 'no').length;
                    const magentaAnswered = magentaQuestions.filter(q => entry[q.id] === 'yes' || entry[q.id] === 'no').length;
                    const yellowAnswered = yellowQuestions.filter(q => entry[q.id] === 'yes' || entry[q.id] === 'no').length;

                    const cyanYes = cyanQuestions.filter(q => entry[q.id] === 'yes').length;
                    const magentaYes = magentaQuestions.filter(q => entry[q.id] === 'yes').length;
                    const yellowYes = yellowQuestions.filter(q => entry[q.id] === 'yes').length;

                    const cyanPercent = cyanAnswered > 0 ? (cyanYes / cyanAnswered) * 100 : null;
                    const magentaPercent = magentaAnswered > 0 ? (magentaYes / magentaAnswered) * 100 : null;
                    const yellowPercent = yellowAnswered > 0 ? (yellowYes / yellowAnswered) * 100 : null;

                    const rating = parseFloat(entry['rating']);
                    let ratingPercent = isNaN(rating) || entry['rating'] === '' ? null : ((rating + 2) / 4) * 100;

                    const harmfulSubstanceQuestions = questions.filter(q => q.substanceType === 'harmful');
                    const hasSubstanceUse = harmfulSubstanceQuestions.some(q => entry[q.id] === 'no');

                    const nootropicQuestions = questions.filter(q => q.substanceType === 'nootropic');
                    const hasNootropics = nootropicQuestions.some(q => entry[q.id] === 'yes');

                    const conflictQuestions = questions.filter(q => q.substanceType === 'conflict');
                    const hasConflict = conflictQuestions.some(q => entry[q.id] === 'yes');

                    const hasSex = entry['d10'] === 'yes';
                    const hasSelfSex = entry['d11'] === 'yes';
                    const hadAlcohol = entry['d3'] === 'no';
                    const hadWorkout = entry['e2'] === 'yes';
                    const hadWalk = entry['m4'] === 'yes';

                    return {
                        originalTimestamp: entry.timestamp,
                        xPos: computeXPos(entry.timestamp),
                        cyan: cyanPercent,
                        magenta: magentaPercent,
                        yellow: yellowPercent,
                        rating: ratingPercent,
                        hasSubstanceUse,
                        hasNootropics,
                        hasConflict,
                        hasSex,
                        hasSelfSex,
                        hadAlcohol,
                        hadWorkout,
                        hadWalk
                    };
                });

                drawPercentChart(ctx, chartData, padding, chartW, chartH);
            } else {
                chartData = filteredData.map(entry => {
                    const sleepHours = parseFloat(entry['h5']) || 0;
                    const healthHours = parseFloat(entry['h4']) || 0;
                    const studioHours = parseFloat(entry['h2']) || 0;
                    const pinkHours = parseFloat(entry['h1']) || 0;
                    const creativeHours = parseFloat(entry['h3']) || 0;

                    const rating = parseFloat(entry['rating']);
                    let ratingScaled = isNaN(rating) || entry['rating'] === '' ? null : ((rating + 2) / 4) * 24;

                    return {
                        originalTimestamp: entry.timestamp,
                        xPos: computeXPos(entry.timestamp),
                        sleep: sleepHours,
                        health: healthHours,
                        studio: studioHours,
                        pink: pinkHours,
                        creative: creativeHours,
                        rating: ratingScaled,
                        hadAlcohol: entry['d3'] === 'no',
                        hadWorkout: entry['e2'] === 'yes',
                        hadWalk: entry['m4'] === 'yes'
                    };
                });

                drawHoursChart(ctx, chartData, padding, chartW, chartH);
            }

            // Store data points for click detection
            chartDataPoints = chartData;

            // Update date range display
            if (filteredData.length > 0) {
                const startDate = new Date(filteredData[0].timestamp);
                const endDate = new Date(filteredData[filteredData.length - 1].timestamp);
                const formatDate = (d) => `${d.getMonth() + 1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`;
                document.getElementById('dateStart').textContent = formatDate(startDate);
                document.getElementById('dateEnd').textContent = formatDate(endDate);
            }
        }

        function drawPercentChart(ctx, data, padding, chartW, chartH) {
            const width = chartW + padding.left + padding.right;
            const height = chartH + padding.top + padding.bottom;

            const colors = {
                cyan: '#00FFFF',
                magenta: '#FF00FF',
                yellow: '#FFFF00',
                white: '#FFFFFF'
            };

            // Y-axis labels
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '10px Karla';
            ctx.textAlign = 'right';
            [100, 75, 50, 25, 0].forEach(v => {
                const y = padding.top + chartH - (v / 100) * chartH;
                ctx.fillText(v, padding.left - 8, y + 3);
            });

            // Subtle grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            [100, 75, 50, 25, 0].forEach(v => {
                const y = padding.top + chartH - (v / 100) * chartH;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartW, y);
                ctx.stroke();
            });

            // Segment data by time gaps so lines break on skipped days
            const GAP_MS = 36 * 60 * 60 * 1000; // 36 hours
            const segments = [];
            {
                let current = [];
                let lastTime = null;
                data.forEach((d, i) => {
                    const t = new Date(d.originalTimestamp).getTime();
                    if (lastTime !== null && t - lastTime > GAP_MS) {
                        if (current.length > 0) segments.push(current);
                        current = [];
                    }
                    current.push(i);
                    lastTime = t;
                });
                if (current.length > 0) segments.push(current);
            }

            // Color lines for gradient fills (cyan, magenta, yellow only - not white)
            const colorLines = [
                { key: 'yellow', color: colors.yellow },
                { key: 'magenta', color: colors.magenta },
                { key: 'cyan', color: colors.cyan }
            ];

            const getSegPoints = (segIndices, key) => segIndices.map(i => {
                const d = data[i];
                const val = d[key];
                return {
                    x: padding.left + d.xPos * chartW,
                    y: val !== null ? padding.top + chartH - (val / 100) * chartH : null,
                    index: i
                };
            }).filter(p => p.y !== null);

            // Gradient fills between color lines, per segment
            segments.forEach(segIndices => {
                const setsForSeg = colorLines.map(l => ({ ...l, points: getSegPoints(segIndices, l.key) }));
                for (let i = 0; i < setsForSeg.length - 1; i++) {
                    const upper = setsForSeg[i + 1];
                    const lower = setsForSeg[i];
                    if (upper.points.length > 1 && lower.points.length > 1) {
                        const grad = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartH);
                        grad.addColorStop(0, rgba(upper.color, 0.25));
                        grad.addColorStop(1, rgba(lower.color, 0.08));
                        ctx.fillStyle = grad;
                        drawSmoothArea(ctx, upper.points, lower.points);
                    }
                }
            });

            // Daily-event marker lines — short verticals (~30% chart height) centered on the
            // reference dot for each event. Drawn AFTER gradient fills (so markers sit on top
            // of them) but BEFORE the smooth lines and dots (so the curves stay clean on top).
            // Slight x-offset between markers so they don't overlap when reference dots land
            // near the same y.
            //   Red     = alcohol consumed (d3 === 'no'),  centered on white rating dot, x-offset LEFT
            //   Cyan    = evening workout  (e2 === 'yes'), centered on cyan dot,         x-offset CENTER
            //   Magenta = morning walk     (m4 === 'yes'), centered on magenta dot,      x-offset RIGHT
            const MARKER_LEN_RATIO = 0.30;
            const MARKER_OFFSET = 3; // px between adjacent markers
            const markerHalf = (chartH * MARKER_LEN_RATIO) / 2;
            ctx.lineWidth = 1.5;
            const drawMarker = (x, val, color) => {
                if (val === null || val === undefined) return;
                const yc = padding.top + chartH - (val / 100) * chartH;
                const y1 = Math.max(padding.top, yc - markerHalf);
                const y2 = Math.min(padding.top + chartH, yc + markerHalf);
                ctx.strokeStyle = color;
                ctx.beginPath();
                ctx.moveTo(x, y1);
                ctx.lineTo(x, y2);
                ctx.stroke();
            };
            data.forEach(d => {
                const cx = padding.left + d.xPos * chartW;
                if (d.hadAlcohol) drawMarker(cx - MARKER_OFFSET, d.rating,  'rgba(255, 0, 0, 0.55)');
                if (d.hadWorkout) drawMarker(cx,                 d.cyan,    'rgba(0, 255, 255, 0.55)');
                if (d.hadWalk)    drawMarker(cx + MARKER_OFFSET, d.magenta, 'rgba(255, 0, 255, 0.55)');
            });

            // All lines including white (rating) — drawn per segment so they break on gaps
            const allLines = [
                { key: 'rating', color: colors.white },
                ...colorLines
            ];

            segments.forEach(segIndices => {
                const setsForSeg = allLines.map(l => ({ ...l, points: getSegPoints(segIndices, l.key) }));
                setsForSeg.forEach(({ points, color }) => {
                    if (points.length > 1) {
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 1.5;
                        drawSmoothLine(ctx, points);
                    }
                });
            });

            // Full point sets across all data (for dot rendering)
            const getPoints = (key) => data.map((d, i) => {
                const val = d[key];
                return {
                    x: padding.left + d.xPos * chartW,
                    y: val !== null ? padding.top + chartH - (val / 100) * chartH : null,
                    index: i
                };
            }).filter(p => p.y !== null);

            const allPointSets = allLines.map(l => ({ ...l, points: getPoints(l.key) }));

            // Dots with marker outlines (same color as line, solid=+1, dashed=-1)
            const dotSize = data.length <= 7 ? 5 : data.length <= 30 ? 3.5 : 2;
            const outlineSize = dotSize + 1; // Ring touches the dot edge

            // Draw dots for each line with appropriate marker outlines
            allPointSets.forEach(({ points, color, key }) => {
                points.forEach((p) => {
                    const d = data[p.index];

                    // Determine which markers apply to this line
                    let hasMarker = false;
                    let isDashed = false;

                    // Magenta/Pink line: substance (-1 dashed) and nootropics (+1 solid)
                    if (key === 'magenta') {
                        if (d.hasSubstanceUse) {
                            hasMarker = true;
                            isDashed = true; // -1
                        } else if (d.hasNootropics) {
                            hasMarker = true;
                            isDashed = false; // +1
                        }
                    }

                    // White/rating line: sex (+1 solid) and self sex (-1 dashed)
                    if (key === 'rating') {
                        if (d.hasSex) {
                            hasMarker = true;
                            isDashed = false; // +1
                        } else if (d.hasSelfSex) {
                            hasMarker = true;
                            isDashed = true; // -1
                        }
                    }

                    // Yellow line: conflict/fights (-1 dashed)
                    if (key === 'yellow') {
                        if (d.hasConflict) {
                            hasMarker = true;
                            isDashed = true; // -1
                        }
                    }

                    // Draw outer ring if marker present (same color as line)
                    if (hasMarker) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, outlineSize, 0, Math.PI * 2);
                        ctx.strokeStyle = color; // Same color as the line
                        ctx.lineWidth = 2;
                        if (isDashed) {
                            ctx.setLineDash([3, 3]);
                        } else {
                            ctx.setLineDash([]);
                        }
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    // Draw the dot - black if has marker, otherwise line color
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, dotSize, 0, Math.PI * 2);
                    ctx.fillStyle = hasMarker ? '#0D0D0D' : color;
                    ctx.fill();
                });
            });
        }

        function drawHoursChart(ctx, data, padding, chartW, chartH) {
            // Y-axis labels
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '10px Karla';
            ctx.textAlign = 'right';
            [24, 12, 0].forEach(v => {
                const y = padding.top + chartH - (v / 24) * chartH;
                ctx.fillText(v + 'h', padding.left - 8, y + 3);
            });

            // Subtle grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            [24, 12, 0].forEach(v => {
                const y = padding.top + chartH - (v / 24) * chartH;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartW, y);
                ctx.stroke();
            });

            // Daily-event marker lines.
            // Cyan = evening workout (centered on the day),
            // Red  = alcohol consumed (offset left of cyan),
            // Magenta = morning walk (offset right of cyan).
            const MARKER_OFFSET = 3; // px from center on each side
            ctx.lineWidth = 1.5;
            data.forEach(d => {
                const cx = padding.left + d.xPos * chartW;
                if (d.hadAlcohol) {
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.55)';
                    ctx.beginPath();
                    ctx.moveTo(cx - MARKER_OFFSET, padding.top);
                    ctx.lineTo(cx - MARKER_OFFSET, padding.top + chartH);
                    ctx.stroke();
                }
                if (d.hadWorkout) {
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.55)';
                    ctx.beginPath();
                    ctx.moveTo(cx, padding.top);
                    ctx.lineTo(cx, padding.top + chartH);
                    ctx.stroke();
                }
                if (d.hadWalk) {
                    ctx.strokeStyle = 'rgba(255, 0, 255, 0.55)';
                    ctx.beginPath();
                    ctx.moveTo(cx + MARKER_OFFSET, padding.top);
                    ctx.lineTo(cx + MARKER_OFFSET, padding.top + chartH);
                    ctx.stroke();
                }
            });

            const categories = [
                { key: 'sleep', color: '#1a1a2e' },
                { key: 'health', color: '#FFFFFF' },
                { key: 'studio', color: '#00FFFF' },
                { key: 'pink', color: '#FF00FF' },
                { key: 'creative', color: '#FFFF00' }
            ];

            // Bar width based on smallest real-time gap between entries
            // so bars don't overlap when entries land in adjacent 3-hour slots
            let minGap = 1;
            if (data.length > 1) {
                const sortedX = data.map(d => d.xPos).sort((a, b) => a - b);
                for (let i = 1; i < sortedX.length; i++) {
                    const g = sortedX[i] - sortedX[i - 1];
                    if (g > 0) minGap = Math.min(minGap, g);
                }
            }
            const barWidth = Math.max(2, Math.min(20, minGap * chartW * 0.7));

            data.forEach((d, i) => {
                const x = padding.left + d.xPos * chartW - barWidth / 2;
                let y = padding.top + chartH;

                categories.forEach((cat, ci) => {
                    const hours = d[cat.key];
                    const h = (hours / 24) * chartH;
                    if (h < 1) return;
                    y -= h;

                    const rgb = hexToRgb(cat.color);
                    const grad = ctx.createLinearGradient(x, y, x, y + h);
                    grad.addColorStop(0, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 1)`);
                    grad.addColorStop(1, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`);
                    ctx.fillStyle = grad;

                    const isTop = ci === categories.length - 1 || categories.slice(ci + 1).every(c => d[c.key] < 0.1);
                    const radius = isTop ? Math.min(barWidth / 2, 4) : 0;

                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.moveTo(x, y + h);
                        ctx.lineTo(x, y + radius);
                        ctx.quadraticCurveTo(x, y, x + radius, y);
                        ctx.lineTo(x + barWidth - radius, y);
                        ctx.quadraticCurveTo(x + barWidth, y, x + barWidth, y + radius);
                        ctx.lineTo(x + barWidth, y + h);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.fillRect(x, y, barWidth, h);
                    }
                });
            });
        }

        // Chart click handler
        function handleChartClick(e) {
            if (chartMode === 'loc' || chartDataPoints.length === 0) return;
            
            const canvas = document.getElementById('myChart');
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX / (window.devicePixelRatio || 1);
            const y = (e.clientY - rect.top) * scaleY / (window.devicePixelRatio || 1);
            
            const chartW = chartWidth - chartPadding.left - chartPadding.right;
            
            // Find closest data point
            let closestIndex = -1;
            let closestDist = Infinity;
            
            chartDataPoints.forEach((d, i) => {
                const pointX = chartPadding.left + d.xPos * chartW;
                const dist = Math.abs(x - pointX);
                if (dist < closestDist && dist < 30) {
                    closestDist = dist;
                    closestIndex = i;
                }
            });
            
            if (closestIndex >= 0) {
                showDataPopup(chartDataPoints[closestIndex].originalTimestamp);
            }
        }

        // ============================================
        // QUIZ LOGIC
        // ============================================
        function startQuiz() {
            currentQuestionIndex = 0;
            responses = {};
            showScreen('quizScreen');
            renderQuestion();
            initCardDragHandlers();
        }

        function initCardDragHandlers() {
            const card = document.getElementById('card');
            if (!card) return;

            card.removeEventListener('mousedown', startDrag);
            card.removeEventListener('touchstart', startDrag);

            card.addEventListener('mousedown', startDrag);
            card.addEventListener('touchstart', startDrag, { passive: false });

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function renderQuestion() {
            const question = questions[currentQuestionIndex];
            const card = document.getElementById('card');
            const sectionLabel = document.getElementById('sectionLabel');
            const cardContent = document.getElementById('cardContent');
            const progressBar = document.getElementById('progressBar');

            if (question.type !== 'text') {
                stopRecording();
            }

            card.style.backgroundColor = '#0D0D0D';
            card.style.borderColor = COLOR_MAP[question.color];
            card.style.transform = 'none';

            let icon = '';
            if (question.section === 'morning') icon = SUN_ICON;
            else if (question.section === 'evening') icon = MOON_ICON;

            sectionLabel.innerHTML = icon + `<span>${SECTION_LABELS[question.section]}</span>`;
            sectionLabel.style.color = COLOR_MAP[question.color];

            const progress = (currentQuestionIndex / questions.length) * 100;
            progressBar.style.width = `${progress}%`;

            const colorHex = COLOR_MAP[question.color];

            if (question.type === 'yesno') {
                cardContent.innerHTML = `<div class="question-text" style="color: ${colorHex}">${question.text}</div>`;
            } else if (question.type === 'text') {
                cardContent.innerHTML = `
                    <div class="text-input-container">
                        <textarea 
                            id="textInput" 
                            class="text-input" 
                            placeholder="tap to type or use microphone..."
                        ></textarea>
                        <div class="input-controls">
                            <button id="micBtn" class="mic-btn" onclick="toggleRecording()">
                                ${MIC_ICON}
                                <span>record</span>
                            </button>
                            <button class="submit-btn" onclick="submitText()">
                                submit
                            </button>
                        </div>
                    </div>
                `;
            } else if (question.type === 'rating') {
                const values = [2, 1, 0, -1, -2];
                cardContent.innerHTML = `<div class="rating-container">
                    ${values.map(val => `
                        <div class="rating-circle" 
                             data-value="${val}"
                             style="border-color: ${colorHex}; color: ${colorHex};"
                             onclick="selectRating(${val})">
                            ${val > 0 ? '+' + val : val}
                        </div>
                    `).join('')}
                </div>`;
            } else if (question.type === 'hours') {
                cardContent.innerHTML = `
                    <div class="slider-container">
                        <div class="question-text" style="color: ${colorHex}; font-size: 24px; margin-bottom: 20px;">${question.text}</div>
                        <div class="slider-value" id="sliderValue" style="color: ${colorHex}">0</div>
                        <div class="slider-wrapper">
                            <input 
                                type="range" 
                                min="0" 
                                max="12" 
                                value="0" 
                                class="hour-slider" 
                                id="hourSlider"
                                style="background: linear-gradient(to right, ${colorHex} 0%, #1A1A1A 0%);"
                                oninput="updateSliderValue(this.value, '${colorHex}')"
                            />
                            <div class="slider-labels">
                                <span>0</span>
                                <span>6</span>
                                <span>12</span>
                            </div>
                        </div>
                        <button class="submit-btn" onclick="submitHours()" style="margin-top: 40px;">
                            submit
                        </button>
                    </div>
                `;
            }
        }

        function updateSliderValue(value, color) {
            document.getElementById('sliderValue').textContent = value;
            const slider = document.getElementById('hourSlider');
            const percentage = (value / 12) * 100;
            slider.style.background = `linear-gradient(to right, ${color} ${percentage}%, #1A1A1A ${percentage}%)`;
        }

        function submitText() {
            const textInput = document.getElementById('textInput');
            const question = questions[currentQuestionIndex];
            responses[question.id] = textInput.value.trim();
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                completeQuiz();
            }
        }

        function submitHours() {
            const slider = document.getElementById('hourSlider');
            const question = questions[currentQuestionIndex];
            responses[question.id] = slider.value;
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                renderQuestion();
            } else {
                completeQuiz();
            }
        }

        function selectRating(value) {
            const question = questions[currentQuestionIndex];
            const circles = document.querySelectorAll('.rating-circle');
            
            circles.forEach(circle => {
                const circleValue = parseInt(circle.getAttribute('data-value'));
                if (circleValue <= value) {
                    circle.style.backgroundColor = COLOR_MAP[question.color];
                }
            });

            responses[question.id] = value;

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    renderQuestion();
                } else {
                    completeQuiz();
                }
            }, 300);
        }

        async function completeQuiz() {
            const timestamp = new Date().toISOString();
            
            const location = await getLocation();
            
            const data = {
                timestamp,
                ...responses
            };
            
            if (location) {
                data.loc = location;
            }

            try {
                await saveData(data);
            } catch (err) {
                console.error('save failed:', err);
                alert('could not save entry — check connection and try again.\n\n' + err.message);
            }
            updateChart();
            showScreen('chartScreen');
        }

        // ============================================
        // DRAG HANDLERS
        // ============================================
        function startDrag(e) {
            const question = questions[currentQuestionIndex];
            if (question.type === 'rating' || question.type === 'text' || question.type === 'hours') return;

            e.preventDefault();
            isDragging = true;
            dragStartX = e.touches ? e.touches[0].clientX : e.clientX;
            dragOffset = 0;

            const card = document.getElementById('card');
            if (card) card.classList.add('dragging');
        }

        function drag(e) {
            if (!isDragging) return;

            const question = questions[currentQuestionIndex];
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            dragOffset = currentX - window.innerWidth / 2;

            const card = document.getElementById('card');
            if (!card) return;

            const rotation = dragOffset * 0.1;
            card.style.transform = `translateX(${dragOffset}px) rotate(${rotation}deg)`;

            if (Math.abs(dragOffset) > 50) {
                if (dragOffset > 0) {
                    card.style.backgroundColor = COLOR_MAP[question.color] + '20';
                } else {
                    card.style.backgroundColor = '#1A1A1A';
                }
            } else {
                card.style.backgroundColor = '#0D0D0D';
            }
        }

        function endDrag() {
            if (!isDragging) return;

            const question = questions[currentQuestionIndex];
            const card = document.getElementById('card');
            
            if (Math.abs(dragOffset) > 150) {
                const answer = dragOffset > 0 ? 'yes' : 'no';
                responses[question.id] = answer;

                card.style.transition = 'transform 0.3s ease';
                card.style.transform = `translateX(${dragOffset > 0 ? '1000px' : '-1000px'}) rotate(${dragOffset > 0 ? '30deg' : '-30deg'})`;

                setTimeout(() => {
                    card.style.transition = '';
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questions.length) {
                        renderQuestion();
                    } else {
                        completeQuiz();
                    }
                }, 300);
            } else {
                card.style.transform = 'none';
                card.style.backgroundColor = '#0D0D0D';
            }

            isDragging = false;
            dragOffset = 0;
            if (card) card.classList.remove('dragging');
        }

        // ============================================
        // SPEECH RECOGNITION
        // ============================================
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    const textInput = document.getElementById('textInput');
                    if (!textInput) return;

                    let finalTranscript = '';
                    let interimTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    textInput.value = (textInput.value + finalTranscript).trim();
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    stopRecording();
                };
            }
        }

        function toggleRecording() {
            if (!recognition) {
                alert('Speech recognition not supported in this browser');
                return;
            }

            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            if (!recognition) return;

            try {
                recognition.start();
                isRecording = true;
                const micBtn = document.getElementById('micBtn');
                if (micBtn) {
                    micBtn.classList.add('recording');
                }
            } catch (error) {
                console.error('Error starting recording:', error);
            }
        }

        function stopRecording() {
            if (!recognition || !isRecording) return;

            try {
                recognition.stop();
                isRecording = false;
                const micBtn = document.getElementById('micBtn');
                if (micBtn) {
                    micBtn.classList.remove('recording');
                }
            } catch (error) {
                console.error('Error stopping recording:', error);
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        window.onload = () => {
            initializeConnection();
            initPopupDragHandlers();
            initSpeechRecognition();
            
            // Add click handler for chart
            const canvas = document.getElementById('myChart');
            canvas.addEventListener('click', handleChartClick);
            
            // Redraw chart on resize
            window.addEventListener('resize', () => {
                clearTimeout(window.resizeTimer);
                window.resizeTimer = setTimeout(updateChart, 100);
            });
        };
    </script>
</body>
</html>
