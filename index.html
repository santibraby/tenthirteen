<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0D0D0D">
    <title>10:13</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Karla', sans-serif;
            background-color: #0D0D0D;
            color: #FFFFFF;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            text-transform: lowercase;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00FFFF, #FF00FF, #FFFF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .version {
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
            text-transform: lowercase;
        }

        .btn {
            background-color: #FFFFFF;
            color: #0D0D0D;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Karla', sans-serif;
            text-transform: lowercase;
            cursor: pointer;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
            transition: opacity 0.3s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Chart Screen */
        .chart-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        .chart-screen.active {
            display: block;
        }

        .chart-wrapper {
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            text-transform: lowercase;
            cursor: pointer;
            background: linear-gradient(45deg, #00FFFF, #FF00FF, #FFFF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .toggle {
            display: flex;
            align-items: center;
            background-color: #1A1A1A;
            border-radius: 20px;
            padding: 4px;
        }

        .toggle-btn {
            background-color: transparent;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Karla', sans-serif;
            text-transform: lowercase;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background-color: #FFFFFF;
            color: #0D0D0D;
        }

        .chart-container {
            flex: 1;
            position: relative;
            padding: 0 20px 90px 20px;
            min-height: 0;
            height: calc(100% - 80px);
        }

        #myChart {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        #globeViz {
            width: 100%;
            height: 100%;
            display: none;
        }

        #globeViz.active {
            display: block;
        }

        .globe-legend {
            position: absolute;
            bottom: 30px;
            left: 40px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
        }

        .globe-legend.active {
            display: block;
        }

        .legend-title {
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        .legend-gradient {
            width: 120px;
            height: 8px;
            background: linear-gradient(90deg, #00FFFF, #FF00FF, #FFFF00);
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            opacity: 0.7;
        }

        .view-toggle-header {
            display: flex;
            align-items: center;
            background-color: #1A1A1A;
            border-radius: 20px;
            padding: 4px;
            gap: 4px;
        }

        .view-toggle-bottom {
            position: absolute;
            bottom: 15px;
            left: 20px;
            display: flex;
            align-items: center;
            background-color: #1A1A1A;
            border-radius: 20px;
            padding: 4px;
            gap: 4px;
        }

        .date-range {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            color: #666;
        }

        .view-btn {
            background-color: transparent;
            color: #FFFFFF;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Karla', sans-serif;
            text-transform: lowercase;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s;
        }

        .view-btn.active {
            background-color: #FFFFFF;
            color: #0D0D0D;
        }

        /* Quiz Screen */
        .quiz-screen {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .quiz-screen.active {
            display: block;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, #00FFFF, #FF00FF, #FFFF00);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .card-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            height: 60%;
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: grab;
            user-select: none;
            transition: all 0.3s ease;
            border: 2px solid;
            background-color: #0D0D0D;
        }

        .card.dragging {
            cursor: grabbing;
            transition: none;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            text-transform: lowercase;
            font-weight: 700;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        .question-text {
            font-size: 48px;
            font-weight: 700;
            text-transform: lowercase;
            line-height: 1.2;
            text-align: center;
            word-break: break-word;
        }

        .rating-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex: 1;
            justify-content: center;
        }

        .rating-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            transition: all 0.2s;
            background-color: transparent;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            flex: 1;
            justify-content: center;
        }

        .slider-value {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .slider-wrapper {
            width: 100%;
            max-width: 350px;
        }

        .hour-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            background: #1A1A1A;
        }

        .hour-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
        }

        .hour-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .slider-submit {
            background-color: transparent;
            border: 2px solid;
            padding: 12px 32px;
            border-radius: 8px;
            font-family: 'Karla', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: lowercase;
            transition: all 0.2s;
        }

        .slider-submit:active {
            transform: scale(0.95);
        }

        .text-input-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            justify-content: center;
        }

        .text-input {
            width: 100%;
            min-height: 150px;
            background-color: transparent;
            border: 2px solid #FFFFFF;
            border-radius: 8px;
            padding: 16px;
            color: #FFFFFF;
            font-family: 'Karla', sans-serif;
            font-size: 16px;
            font-weight: 700;
            resize: none;
            outline: none;
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .mic-btn, .submit-btn {
            background-color: transparent;
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Karla', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .mic-btn:active, .submit-btn:active {
            background-color: #FFFFFF;
            color: #0D0D0D;
        }

        .mic-btn.recording {
            background-color: #FF0000;
            border-color: #FF0000;
            color: #FFFFFF;
        }

        /* Data Popup */
        .data-popup {
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background-color: #0D0D0D;
            border: 2px solid #FFFFFF;
            border-radius: 16px;
            padding: 32px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .data-popup.active {
            display: block;
        }

        .popup-date {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            text-transform: lowercase;
        }

        .popup-section {
            margin-bottom: 24px;
        }

        .popup-section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: lowercase;
        }

        .popup-item {
            margin-left: 28px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .popup-item.yes {
            opacity: 1;
        }

        .popup-item.no {
            opacity: 0.3;
        }

        .popup-response {
            background-color: #1A1A1A;
            border: 2px solid #FFFFFF;
            border-radius: 8px;
            padding: 16px;
            color: #FFFFFF;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 8px;
            white-space: pre-wrap;
        }

        .popup-rating {
            font-size: 48px;
            font-weight: 700;
            color: #FFFFFF;
            text-align: center;
            margin: 16px 0;
        }

        .popup-hours {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin: 12px 0;
        }

        .hidden {
            display: none;
        }

        /* PAT input */
        .pat-input {
            background: #1A1A1A;
            color: #FFFFFF;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 14px 16px;
            font-family: 'Karla', sans-serif;
            font-size: 14px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .pat-input:focus {
            outline: none;
            border-color: #666;
        }
        .pat-hint {
            font-size: 11px;
            color: #666;
            max-width: 300px;
            text-align: center;
            line-height: 1.5;
            margin-top: 14px;
            padding: 0 16px;
        }
        .pat-hint a {
            color: #888;
            text-decoration: underline;
        }
        .pat-status {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
            min-height: 16px;
            text-align: center;
        }
        .pat-status.error {
            color: #ff6b6b;
        }
        .reset-link {
            position: fixed;
            bottom: 8px;
            right: 10px;
            font-size: 10px;
            color: #333;
            cursor: pointer;
            user-select: none;
            z-index: 100;
            font-family: 'Karla', sans-serif;
        }
        .reset-link:hover {
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="logo">10:13</div>
        <div class="version">v2.0.0</div>
        <input type="password" class="pat-input" id="patInput" placeholder="github access token" autocomplete="off" spellcheck="false">
        <button class="btn" id="connectBtn" onclick="handleConnect()">connect</button>
        <div class="pat-status" id="patStatus"></div>
        <div class="pat-hint">
            fine-grained PAT, scoped to <strong>tenthirteen-data</strong> only, with<br>contents: read/write. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">generate one</a>.
        </div>
    </div>
    <div class="reset-link" id="resetLink" onclick="resetConnection()" style="display: none;">reset connection</div>

    <!-- Chart Screen -->
    <div id="chartScreen" class="chart-screen">
        <div class="chart-wrapper">
            <div class="header">
                <div class="title" onclick="startQuiz()">10:13</div>
                <div class="toggle">
                    <button class="toggle-btn active" id="toggle1w" onclick="setTimeRange('1w')">1w</button>
                    <button class="toggle-btn" id="toggle1m" onclick="setTimeRange('1m')">1m</button>
                    <button class="toggle-btn" id="toggleAll" onclick="setTimeRange('all')">all</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
                <div id="globeViz"></div>
                <div class="globe-legend" id="globeLegend">
                    <div class="legend-title">entries over time</div>
                    <div class="legend-gradient"></div>
                    <div class="legend-labels">
                        <span>oldest</span>
                        <span>newest</span>
                    </div>
                </div>
                <div class="view-toggle-bottom" id="viewToggle">
                    <button class="view-btn active" id="viewPercent" onclick="setChartMode('percent')">%</button>
                    <button class="view-btn" id="viewHours" onclick="setChartMode('hours')">hours</button>
                    <button class="view-btn" id="viewLoc" onclick="setChartMode('loc')">loc</button>
                </div>
                <div class="date-range" id="dateRange">
                    <span id="dateStart"></span>
                    <span id="dateEnd"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Popup -->
    <div id="dataPopup" class="data-popup">
        <div id="popupContent"></div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="quiz-screen">
        <div class="progress-bar" id="progressBar"></div>
        <div class="card-container">
            <div class="card" id="card">
                <div class="section-label" id="sectionLabel"></div>
                <div id="cardContent"></div>
                <div></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // QUESTIONS CONFIGURATION
        // ============================================
        const QUESTIONS = [
            // Morning (m1-m13, skipping m2 and m11 which were removed)
            { id: 'm1', section: 'morning', text: 'make bed?', color: 'M' },
            { id: 'm3', section: 'morning', text: 'colostrum AM?', color: 'C' },

            { id: 'm6', section: 'morning', text: 'journal?', color: 'M' },
            { id: 'm7', section: 'morning', text: 'shower AM?', color: 'C' },

            { id: 'm13', section: 'morning', text: 'daily vitamin?', color: 'M' },
            
            // Evening (e1-e10, skipping e6 and e7 which were removed)
            { id: 'e1', section: 'evening', text: 'colostrum PM?', color: 'C' },

            { id: 'e9', section: 'evening', text: 'recline at 10:30?', color: 'M' },

            { id: 'd1', section: 'daily', text: 'nicotine free?', color: 'M', substanceType: 'harmful' },
            { id: 'd2', section: 'daily', text: 'cannabis free?', color: 'M', substanceType: 'harmful' },
            { id: 'd3', section: 'daily', text: 'alcohol free?', color: 'M', substanceType: 'harmful' },
            { id: 'd4', section: 'daily', text: 'caffeine?', color: 'M' },
            { id: 'd5', section: 'daily', text: 'nootropics?', color: 'M', substanceType: 'nootropic' },
            
            // Daily social (d6-d9)
            { id: 'd6', section: 'daily', text: 'connect with friends?', color: 'Y' },
            { id: 'd7', section: 'daily', text: 'connect with family?', color: 'Y' },
            { id: 'd8', section: 'daily', text: 'quality time with Maria?', color: 'Y' },
            { id: 'd9', section: 'daily', text: 'take care of Peppa?', color: 'Y' },
            
            // Daily intimacy (d10-d11)
            { id: 'd10', section: 'daily', text: 'sex?', color: 'W', intimacyType: 'sex' },
            { id: 'd11', section: 'daily', text: 'self sex?', color: 'W', intimacyType: 'selfSex' },
            
            // Relationship effort (d12-d16)
            { id: 'd12', section: 'daily', text: 'initiated affection?', color: 'Y' },
            { id: 'd13', section: 'daily', text: 'expressed appreciation?', color: 'Y' },
            { id: 'd14', section: 'daily', text: 'let something go?', color: 'Y' },
            { id: 'd15', section: 'daily', text: 'real conversation?', color: 'Y' },
            { id: 'd16', section: 'daily', text: 'conflict with Maria?', color: 'Y', substanceType: 'conflict' },
            
            // Home (d17)
            { id: 'd17', section: 'daily', text: 'left it better?', color: 'C' },
            
            // Hours (h1-h5)
            { id: 'h1', section: 'hours', text: 'pinkProportion hours', color: 'M' },
            { id: 'h2', section: 'hours', text: 'FR studio hours', color: 'C' },
            { id: 'h3', section: 'hours', text: 'FR creative hours', color: 'Y' },
            { id: 'h4', section: 'hours', text: 'health hours', color: 'W' },
            { id: 'h5', section: 'hours', text: 'sleep (last night)', color: 'M', barColor: 'black' },
            
            // Text and rating
            { id: 'text', section: 'text', text: 'daily response', color: 'W' },
            { id: 'rating', section: 'rating', text: 'daily rating', color: 'W' }
        ];

        // ============================================
        // APP CONFIGURATION
        // ============================================
        const DATA_OWNER = 'santibraby';
        const DATA_REPO = 'tenthirteen-data';
        const DATA_BRANCH = 'main';
        const DATA_START_YEAR = 2025; // first year with entries; don't move backwards
        const LEGACY_FILE = 'data.json'; // single-file format, auto-migrated on first load
        const PAT_STORAGE_KEY = 'tenthirteen_gh_pat';
        const dataPath = (year) => `data-${year}.json`;
        const dataUrl = (path) => `https://api.github.com/repos/${DATA_OWNER}/${DATA_REPO}/contents/${path}`;

        const COLOR_MAP = {
            'C': '#00FFFF',  // Cyan
            'M': '#FF00FF',  // Magenta
            'Y': '#FFFF00',  // Yellow
            'W': '#FFFFFF'   // White
        };

        const SECTION_LABELS = {
            'morning': 'Morning Checklist',
            'evening': 'Evening Checklist',
            'daily': 'Daily Checklist',
            'hours': 'Hours Tracking',
            'text': 'Daily Response',
            'rating': 'Daily Rating'
        };

        // SVG Icons

        // ============================================

        // ============================================
        // CHART DRAWING UTILITIES
        // ============================================
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 255, b: 255 };
        }

        function rgba(hex, alpha) {
            const { r, g, b } = hexToRgb(hex);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function setupCanvas(canvas) {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            return { ctx, width: rect.width, height: rect.height };
        }

        function getControlPoints(points, tension = 0.3) {
            const cp = [];
            for (let i = 0; i < points.length; i++) {
                const p0 = points[i === 0 ? 0 : i - 1];
                const p1 = points[i];
                const p2 = points[i === points.length - 1 ? i : i + 1];
                const p3 = points[i >= points.length - 2 ? points.length - 1 : i + 2];
                cp.push({
                    cp1x: p1.x + (p2.x - p0.x) * tension,
                    cp1y: p1.y + (p2.y - p0.y) * tension,
                    cp2x: p2.x - (p3.x - p1.x) * tension,
                    cp2y: p2.y - (p3.y - p1.y) * tension
                });
            }
            return cp;
        }

        function drawSmoothLine(ctx, points) {
            if (points.length < 2) return;
            const cp = getControlPoints(points);
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                ctx.bezierCurveTo(cp[i].cp1x, cp[i].cp1y, cp[i].cp2x, cp[i].cp2y, points[i + 1].x, points[i + 1].y);
            }
            ctx.stroke();
        }

        function drawSmoothArea(ctx, topPoints, bottomPoints) {
            if (topPoints.length < 2) return;
            const cpTop = getControlPoints(topPoints);
            const bottomRev = [...bottomPoints].reverse();
            const cpBot = getControlPoints(bottomRev);

            ctx.beginPath();
            ctx.moveTo(topPoints[0].x, topPoints[0].y);
            for (let i = 0; i < topPoints.length - 1; i++) {
                ctx.bezierCurveTo(cpTop[i].cp1x, cpTop[i].cp1y, cpTop[i].cp2x, cpTop[i].cp2y, topPoints[i + 1].x, topPoints[i + 1].y);
            }
            ctx.lineTo(bottomRev[0].x, bottomRev[0].y);
            for (let i = 0; i < bottomRev.length - 1; i++) {
                ctx.bezierCurveTo(cpBot[i].cp1x, cpBot[i].cp1y, cpBot[i].cp2x, cpBot[i].cp2y, bottomRev[i + 1].x, bottomRev[i + 1].y);
            }
            ctx.closePath();
            ctx.fill();
        }

        // ============================================
        // GITHUB AUTH + DATA
        // ============================================
        // UTF-8 safe base64 helpers (handles unicode in the text field cleanly).
        function b64encodeUtf8(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }
        function b64decodeUtf8(b64) {
            return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
        }

        function setPatStatus(msg, isError = false) {
            const el = document.getElementById('patStatus');
            if (!el) return;
            el.textContent = msg || '';
            el.classList.toggle('error', !!isError);
        }

        async function ghFetch(url, opts = {}) {
            return fetch(url, {
                ...opts,
                headers: {
                    Authorization: `Bearer ${githubToken}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    ...(opts.headers || {})
                }
            });
        }

        function entryYear(entry) {
            return new Date(entry.timestamp).getUTCFullYear();
        }

        // Rebuild the flat, sorted quizData array that the charts consume.
        function rebuildQuizData() {
            const years = Object.keys(yearData).map(Number).sort((a, b) => a - b);
            const flat = [];
            years.forEach(y => flat.push(...yearData[y]));
            flat.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            quizData = flat;
        }

        // GET one year's file. Returns { sha, entries } or null if 404.
        async function loadYearFile(year) {
            const res = await ghFetch(`${dataUrl(dataPath(year))}?ref=${DATA_BRANCH}&t=${Date.now()}`, {
                cache: 'no-store'
            });
            if (res.status === 404) return null;
            if (res.status === 401 || res.status === 403) throw new Error('AUTH');
            if (!res.ok) throw new Error(`load ${dataPath(year)} failed: ${res.status}`);
            const body = await res.json();
            let parsed = [];
            try {
                parsed = JSON.parse(b64decodeUtf8(body.content));
            } catch (e) {
                console.error(`${dataPath(year)} is not valid JSON:`, e);
            }
            return {
                sha: body.sha,
                entries: Array.isArray(parsed) ? parsed : []
            };
        }

        // GET legacy data.json, returns { sha, entries } or null if 404.
        async function loadLegacyFile() {
            const res = await ghFetch(`${dataUrl(LEGACY_FILE)}?ref=${DATA_BRANCH}&t=${Date.now()}`, {
                cache: 'no-store'
            });
            if (res.status === 404) return null;
            if (res.status === 401 || res.status === 403) throw new Error('AUTH');
            if (!res.ok) throw new Error(`load ${LEGACY_FILE} failed: ${res.status}`);
            const body = await res.json();
            let parsed = [];
            try {
                parsed = JSON.parse(b64decodeUtf8(body.content));
            } catch (e) {
                console.error(`${LEGACY_FILE} is not valid JSON:`, e);
            }
            return {
                sha: body.sha,
                entries: Array.isArray(parsed) ? parsed : []
            };
        }

        // PUT a year file with the given entries.
        async function writeYearFile(year, entries, message) {
            const sorted = [...entries].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            const content = b64encodeUtf8(JSON.stringify(sorted, null, 2) + '\n');
            const sha = yearShas[year];
            const res = await ghFetch(dataUrl(dataPath(year)), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message,
                    content,
                    branch: DATA_BRANCH,
                    ...(sha ? { sha } : {})
                })
            });
            if (res.status === 401 || res.status === 403) throw new Error('AUTH');
            if (!res.ok) {
                const text = await res.text().catch(() => '');
                throw new Error(`write ${dataPath(year)} failed: ${res.status} ${text}`);
            }
            const body = await res.json();
            yearData[year] = sorted;
            yearShas[year] = body.content?.sha || null;
            return body;
        }

        // One-time migration: split legacy data.json into year files, delete legacy.
        // Safe to re-run: if year files already exist for some years, merges by timestamp.
        async function migrateFromLegacy() {
            const legacy = await loadLegacyFile();
            if (!legacy) return; // nothing to migrate

            setPatStatus(`migrating ${legacy.entries.length} entries into yearly files…`);

            // Merge legacy entries into yearData (dedupe by timestamp).
            legacy.entries.forEach(e => {
                const y = entryYear(e);
                if (!yearData[y]) yearData[y] = [];
                const dup = yearData[y].some(existing => existing.timestamp === e.timestamp);
                if (!dup) yearData[y].push(e);
            });

            // Write every year that has entries (replacing any existing content).
            const years = Object.keys(yearData).map(Number).sort((a, b) => a - b);
            for (const y of years) {
                await writeYearFile(y, yearData[y], `migrate: create ${dataPath(y)} (${yearData[y].length} entries)`);
            }

            // Delete the legacy file.
            const delRes = await ghFetch(dataUrl(LEGACY_FILE), {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: 'migrate: partition data.json into yearly files',
                    sha: legacy.sha,
                    branch: DATA_BRANCH
                })
            });
            if (!delRes.ok && delRes.status !== 404) {
                const text = await delRes.text().catch(() => '');
                console.warn(`couldn't delete legacy data.json: ${delRes.status} ${text}`);
            }

            setPatStatus('');
        }

        async function loadData() {
            yearData = {};
            yearShas = {};
            const currentYear = new Date().getUTCFullYear();

            // Load every year file from DATA_START_YEAR to current year.
            for (let y = DATA_START_YEAR; y <= currentYear; y++) {
                const result = await loadYearFile(y);
                if (result) {
                    yearData[y] = result.entries;
                    yearShas[y] = result.sha;
                }
            }

            // Self-heal: if legacy data.json still exists (including after an interrupted
            // migration), merge it in and delete it. Cheap 404 check after migration runs once.
            await migrateFromLegacy();

            rebuildQuizData();
        }

        async function saveData(entry) {
            const year = entryYear(entry);
            const currentEntries = yearData[year] || [];
            const newEntries = [...currentEntries, entry];

            try {
                await writeYearFile(year, newEntries, `add entry ${entry.timestamp}`);
            } catch (err) {
                // SHA conflict: another device wrote to this year's file. Reload and retry once.
                if (err.message && (err.message.includes('409') || err.message.includes('422'))) {
                    console.warn('sha conflict on', dataPath(year), '— reloading and retrying');
                    const reloaded = await loadYearFile(year);
                    if (reloaded) {
                        yearData[year] = reloaded.entries;
                        yearShas[year] = reloaded.sha;
                    }
                    const retryEntries = [...(yearData[year] || []), entry];
                    await writeYearFile(year, retryEntries, `add entry ${entry.timestamp}`);
                } else {
                    throw err;
                }
            }

            rebuildQuizData();
        }

        // Connect flow: validate token, then load data and show chart.
        async function connectWithToken(token) {
            githubToken = token;
            try {
                setPatStatus('connecting...');
                await loadData();
                localStorage.setItem(PAT_STORAGE_KEY, token);
                setPatStatus('');
                document.getElementById('resetLink').style.display = 'block';
                updateChart();
                showScreen('chartScreen');
                return true;
            } catch (err) {
                console.error('connect failed:', err);
                githubToken = null;
                if (err.message === 'AUTH') {
                    setPatStatus('invalid or expired token — try again', true);
                } else {
                    setPatStatus('connection failed — check network', true);
                }
                return false;
            }
        }

        // ============================================
        // DATA POPUP
        // ============================================
        function initPopupDragHandlers() {
            const popup = document.getElementById('dataPopup');
            let popupDragStartX = 0;
            let popupDragOffset = 0;
            let popupIsDragging = false;

            const startPopupDrag = (e) => {
                if (e.target.id === 'dataPopup') {
                    popupIsDragging = true;
                    popupDragStartX = e.touches ? e.touches[0].clientX : e.clientX;
                    popupDragOffset = 0;
                }
            };

            const popupDrag = (e) => {
                if (!popupIsDragging) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                popupDragOffset = currentX - popupDragStartX;
            };

            const endPopupDrag = () => {
                if (!popupIsDragging) return;

                if (Math.abs(popupDragOffset) > 100) {
                    closeDataPopup();
                }

                popupIsDragging = false;
                popupDragOffset = 0;
            };

            popup.addEventListener('touchstart', startPopupDrag, { passive: false });
            popup.addEventListener('touchmove', popupDrag, { passive: false });
            popup.addEventListener('touchend', endPopupDrag);
            popup.addEventListener('mousedown', startPopupDrag);
            document.addEventListener('mousemove', popupDrag);
            document.addEventListener('mouseup', endPopupDrag);
        }

        function showDataPopup(timestamp) {
            const entry = quizData.find(e => e.timestamp === timestamp);
            if (!entry) return;

            const popup = document.getElementById('dataPopup');
            const content = document.getElementById('popupContent');

            let html = `<div class="popup-timestamp">${new Date(timestamp).toLocaleString()}</div>`;

            const sections = {};
            questions.forEach(q => {
                if (!sections[q.section]) {
                    sections[q.section] = [];
                }
                sections[q.section].push(q);
            });

            Object.keys(sections).forEach(sectionKey => {
                html += `<div class="popup-section">`;
                html += `<div class="popup-section-title">${SECTION_LABELS[sectionKey]}</div>`;
                
                sections[sectionKey].forEach(q => {
                    const value = entry[q.id] || '-';
                    const color = COLOR_MAP[q.color];
                    
                    if (q.type === 'rating') {
                        html += `<div class="popup-item"><span class="popup-label">${q.text}:</span> <span style="color: ${color}">${value}</span></div>`;
                    } else if (q.type === 'text') {
                        html += `<div class="popup-item"><span class="popup-label">${q.text}:</span> <span style="color: ${color}">${value || 'none'}</span></div>`;
                    } else if (q.type === 'hours') {
                        html += `<div class="popup-item"><span class="popup-label">${q.text}:</span> <span style="color: ${color}">${value}h</span></div>`;
                    } else {
                        html += `<div class="popup-item"><span class="popup-label">${q.text}:</span> <span style="color: ${color}">${value}</span></div>`;
                    }
                });
                
                html += `</div>`;
